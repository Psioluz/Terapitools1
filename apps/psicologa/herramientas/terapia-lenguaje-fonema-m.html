<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Psicoluz — Terapia de Lenguaje</title>
<style>
  :root{
    color-scheme: light;
    --navy:#4a0e2e;
    --teal:#12B5AC;
    --coral:#FF6A57;
    --gold:#e91e8c;
    --mint:#E4FBF3;
    --paper:#FFFCF3;
    --ink:#14171C;
    --ink-soft:#495468;
    --card:#FFFFFF;
    --ring:#DCEFEA;
    --shadow: 0 12px 28px -12px rgba(18,41,79,0.28);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;color-scheme:light;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--mint), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, color-mix(in srgb, var(--gold) 18%, transparent), transparent 55%),
      var(--paper);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    padding: 20px 14px 48px;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  .blob{
    position:fixed; border-radius:50%; filter:blur(2px); opacity:0.35; z-index:0; pointer-events:none;
    animation: floaty 7s ease-in-out infinite;
  }
  .blob.b1{width:220px;height:220px;background:var(--teal);top:-60px;left:-70px; animation-duration:8s;}
  .blob.b2{width:160px;height:160px;background:var(--gold);bottom:-40px;right:-40px;opacity:0.3; animation-duration:6.5s; animation-delay:.4s;}
  .blob.b3{width:120px;height:120px;background:var(--coral);top:40%;right:-60px;opacity:0.18; animation-duration:9s; animation-delay:.8s;}
  @keyframes floaty{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(10px,-16px) scale(1.06); } }

  .app{
    position:relative; z-index:1;
    width:100%; max-width:480px;
  }

  .topbar{
    background:var(--navy);
    border-radius:26px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
  }
  .topbar img.logo{height:64px;width:auto;display:block;border-radius:12px;background:#fff;padding:4px;flex-shrink:0;}
  .back-btn{
    border:none; background:rgba(255,255,255,0.12); color:#fff;
    width:38px;height:38px;border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
  }
  .back-btn:active{transform:scale(0.92);}
  .top-meta{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .top-title{ color:#fff; font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .level-pill{
    align-self:flex-start;
    font-size:11px; font-weight:800; letter-spacing:.04em;
    color:var(--navy); background:var(--gold);
    padding:3px 10px; border-radius:999px;
  }
  .dots{display:flex; gap:6px; flex-wrap:wrap;}
  .dot{width:14px;height:8px;border-radius:6px;background:rgba(255,255,255,0.25);transition:all .25s ease;}
  .dot.done{background:var(--teal); width:20px;}
  .dot.current{background:var(--gold); width:20px;}
  .stars{
    display:flex; align-items:center; gap:4px;
    color:var(--gold); font-weight:800; font-size:14px;
    background:rgba(255,255,255,0.08); padding:6px 10px; border-radius:999px;
    flex-shrink:0;
  }
  .stars.pop{ animation: starPop .5s ease; }
  @keyframes starPop{ 0%{transform:scale(1);} 35%{transform:scale(1.35) rotate(-6deg);} 60%{transform:scale(0.95) rotate(4deg);} 100%{transform:scale(1);} }

  .stage{
    margin-top:16px;
    background:var(--card);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:22px 20px 26px;
    position:relative;
    min-height:520px;
    display:flex;
    flex-direction:column;
  }

  h1.game-title{
    font-size:24px; margin:2px 0 4px; letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .sub{color:var(--ink-soft); font-size:14.5px; margin:0 0 18px;}

  .word-panel{
    background:var(--mint);
    border:2px solid var(--ring);
    border-radius:22px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .word-panel img.pic{
    width:84px;height:84px;border-radius:16px;object-fit:cover;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.25);
    background:#fff;
    flex-shrink:0;
  }
  .slots{
    display:flex; gap:8px; flex-wrap:wrap; flex:1; min-width:120px;
  }
  .slot{
    min-width:50px; height:50px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:var(--ink);
    background:var(--card);
    border:2.5px dashed var(--ring);
    text-transform:uppercase;
    transition: all .2s ease;
    padding:0 6px;
  }
  .slot.filled{
    border-style:solid; border-color:var(--teal);
    background: color-mix(in srgb, var(--teal) 14%, var(--card));
    animation: pop .28s ease;
  }
  @keyframes pop{ 0%{transform:scale(.7);} 60%{transform:scale(1.12);} 100%{transform:scale(1);} }

  .listen-btn{
    border:none; background:var(--teal); color:#fff;
    width:44px;height:44px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    box-shadow:0 6px 14px -6px rgba(30,166,160,0.6);
  }
  .listen-btn:active{transform:scale(0.92);}
  .listen-btn svg{width:20px;height:20px;fill:#fff;}

  .prompt{
    font-size:15px; font-weight:700; color:var(--ink-soft);
    margin:0 0 12px;
  }
  .prompt b{color:var(--navy);}

  .options{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-top:auto;
  }
  .opt{
    border:none;
    border-radius:20px;
    padding:16px 8px;
    font-size:21px; font-weight:800;
    letter-spacing:.02em;
    text-transform:uppercase;
    background:var(--card);
    color:var(--ink);
    border:2.5px solid var(--ring);
    cursor:pointer;
    box-shadow:0 6px 0 var(--ring);
    transition: transform .08s ease, box-shadow .08s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:56px;
  }
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 var(--ring);}
  .opt.correct{
    background: color-mix(in srgb, var(--teal) 22%, var(--card));
    border-color:var(--teal);
    box-shadow:0 6px 0 var(--teal);
    animation: bounce .4s ease;
  }
  .opt.wrong{
    background: color-mix(in srgb, var(--coral) 20%, var(--card));
    border-color:var(--coral);
    box-shadow:0 6px 0 var(--coral);
    animation: shake .4s ease;
  }
  @keyframes bounce{ 0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .footer-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-top:18px; flex-wrap:wrap;
  }
  .mouth-hint{ font-size:12.5px; color:var(--ink-soft); flex:1; min-width:160px; }
  .next-btn{
    border:none; border-radius:16px; padding:14px 22px;
    background:var(--navy); color:#fff; font-weight:800; font-size:15px;
    cursor:pointer; box-shadow:0 6px 0 color-mix(in srgb, var(--navy) 70%, black);
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition: all .25s ease;
  }
  .next-btn.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .next-btn:active{transform:translateY(4px); box-shadow:0 2px 0 color-mix(in srgb, var(--navy) 70%, black);}

  /* Centered screens: welcome / level-complete */
  .center-screen{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:14px; flex:1; justify-content:center; padding:10px 4px;
  }
  .center-screen img.logo-big{width:220px;}
  .center-screen img.logo-big.bounce-in{ animation: logoBounce 1s cubic-bezier(.34,1.6,.64,1) both; }
  @keyframes logoBounce{ 0%{transform:scale(.4) rotate(-8deg); opacity:0;} 60%{transform:scale(1.08) rotate(3deg); opacity:1;} 100%{transform:scale(1) rotate(0);} }
  .center-screen h1{font-size:26px;margin:0; text-wrap:balance;}
  .center-screen p{color:var(--ink-soft); font-size:15px; max-width:340px; margin:0;}
  .cta{
    border:none; border-radius:18px; padding:16px 30px;
    background:var(--teal); color:#fff; font-weight:800; font-size:17px;
    cursor:pointer; box-shadow:0 6px 0 #157a75; margin-top:8px;
    min-height:52px;
  }
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #157a75;}
  .cta.secondary{
    background:var(--card); color:var(--navy); border:2.5px solid var(--ring);
    box-shadow:0 6px 0 var(--ring);
  }
  .cta.secondary:active{box-shadow:0 3px 0 var(--ring);}

  .link-btn{
    border:none; background:none; color:var(--ink-soft);
    font-size:13px; font-weight:700; text-decoration:underline;
    cursor:pointer; margin-top:2px; padding:6px;
  }

  .guide{ text-align:left; overflow-y:auto; max-height:520px; padding-right:2px; }
  .guide h3{ font-size:15px; color:var(--navy); margin:16px 0 6px; }
  .guide h3:first-of-type{ margin-top:4px; }
  .g-text{ font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0; }
  .g-list{ margin:0; padding-left:20px; font-size:14px; color:var(--ink-soft); line-height:1.55; }
  .g-list li{ margin-bottom:4px; }
  .guide .cta{ margin-top:18px; width:100%; }

  .badge-row{display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; justify-content:center;}
  .badge{
    background:var(--mint); border:1.5px solid var(--ring); border-radius:12px;
    padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--navy);
  }

  /* Phoneme picker */
  .grid-title{font-size:22px; margin:2px 0 4px;}
  .phoneme-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:16px;
  }
  .phoneme-card{
    border:2.5px solid var(--ring); background:var(--card); border-radius:20px;
    padding:16px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; box-shadow:0 6px 0 var(--ring); transition: transform .08s ease;
  }
  .phoneme-card:active{transform:translateY(3px); box-shadow:0 3px 0 var(--ring);}
  .phoneme-card .letter{font-size:30px; font-weight:800; color:var(--navy); display:inline-block; animation: idleBob 3.2s ease-in-out infinite; }
  .phoneme-card:nth-child(3n+1) .letter{animation-delay:0s;}
  .phoneme-card:nth-child(3n+2) .letter{animation-delay:.3s;}
  .phoneme-card:nth-child(3n+3) .letter{animation-delay:.6s;}
  @keyframes idleBob{ 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-4px) rotate(-3deg);} }
  .phoneme-card .name{font-size:11px; color:var(--ink-soft); font-weight:700;}
  .phoneme-card.locked{ cursor:default; opacity:0.55; box-shadow:none; }
  .phoneme-card.locked .letter{color:var(--ink-soft);}
  .phoneme-card .soon{font-size:9.5px; color:var(--coral); font-weight:800; letter-spacing:.03em;}

  /* Level picker */
  .level-list{ display:flex; flex-direction:column; gap:12px; margin-top:16px; }
  .level-card{
    border:2.5px solid var(--ring); background:var(--card); border-radius:20px;
    padding:16px; display:flex; align-items:center; gap:14px;
    cursor:pointer; box-shadow:0 6px 0 var(--ring); transition: transform .08s ease;
  }
  .level-card:active{transform:translateY(3px); box-shadow:0 3px 0 var(--ring);}
  .level-num{
    width:44px;height:44px;border-radius:50%; flex-shrink:0;
    background:var(--mint); color:var(--navy); font-weight:800; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .level-card.done .level-num{ background:var(--teal); color:#fff; }
  .level-info{flex:1; text-align:left;}
  .level-info .lname{font-weight:800; font-size:16px;}
  .level-info .ldesc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .level-check{font-size:20px; color:var(--teal);}
  .level-card.warmup{ background:linear-gradient(135deg, color-mix(in srgb, var(--gold) 22%, var(--card)), var(--card)); border-color:var(--gold); }
  .warmup-num{ background:var(--gold); font-size:20px; }

  .warmup-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(76px, 1fr)); gap:10px; margin-top:18px;
  }
  .warmup-tile{
    border:2.5px solid var(--ring); background:var(--card); border-radius:18px;
    padding:18px 4px; font-size:19px; font-weight:800; color:var(--navy);
    cursor:pointer; box-shadow:0 6px 0 var(--ring); min-height:64px;
    animation: tileIn .4s ease both;
  }
  .warmup-tile:active{transform:translateY(3px); box-shadow:0 3px 0 var(--ring);}
  .warmup-tile.popped{ animation: bounce .35s ease; background: color-mix(in srgb, var(--teal) 22%, var(--card)); border-color:var(--teal); }
  @keyframes tileIn{ from{ opacity:0; transform:translateY(10px) scale(.9); } to{ opacity:1; transform:translateY(0) scale(1); } }

  .confetti-layer{
    position:fixed; inset:0; pointer-events:none; z-index:50;
  }
  .confetto{
    position:absolute; top:-10px; width:9px;height:14px; border-radius:2px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity:0.9; }
  }

  .final-stars{font-size:40px; letter-spacing:6px; animation: wiggle 1.2s ease infinite;}
  @keyframes wiggle{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  .yay{ font-size:15px; font-weight:800; color:var(--teal); text-transform:uppercase; letter-spacing:.06em; }

  footer.credit{
    text-align:center; margin-top:14px; font-size:11.5px; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  footer.credit img{height:16px; opacity:.8;}

  @media (max-width:380px){
    body{padding:14px 10px 36px;}
    .stage{padding:18px 14px 20px;}
    h1.game-title, .grid-title{font-size:21px;}
    .center-screen h1{font-size:23px;}
    .opt{font-size:19px; padding:14px 6px;}
    .phoneme-grid{grid-template-columns:repeat(3, 1fr); gap:9px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
  }
</style>

    K:  { type:"velar, oral, sordo", cue:"Levanta la parte de atrás de la lengua hacia el paladar y suelta el aire de golpe" },
    B:  { type:"bilabial, oral, sonoro", cue:"Junta los labios y haz vibrar la voz al soltarlos (pon una mano en el cuello)" },
    D:  { type:"alveolar, oral, sonoro", cue:"Toca con la lengua detrás de los dientes de arriba y haz vibrar la voz" },
    G:  { type:"velar, oral, sonoro", cue:"Levanta la parte de atrás de la lengua hacia el paladar y haz vibrar la voz" },
    F:  { type:"labiodental, fricativo, sordo", cue:"Apoya los dientes de arriba sobre el labio de abajo y sopla, sin usar la voz" },

  var MOUTH_CUES = {
    A: "boca bien abierta, como al bostezar",
    E: "labios en sonrisa suave, poco abiertos",
    I: "labios en sonrisa amplia, casi cerrados",
    O: "labios redondos, un poco adelantados",
    U: "labios muy redondos, como para silbar"
  };

  function mouthHintFor(phonemeKey, syllable){
    var vowel = syllable.slice(-1).toUpperCase();
    var cue = MOUTH_CUES[vowel] || "abre la boca para la vocal";
    var artic = ARTIC[phonemeKey] || ARTIC.M;
    return "👄 " + artic.cue + ", y pasa a " + cue + ".";
  }

  var voiceCache = [];
  function loadVoices(){
    voiceCache = window.speechSynthesis.getVoices() || [];
  }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickSpanishVoice(){
    var voices = voiceCache.length ? voiceCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
    var priority = ["es-419","es-mx","es-us","es-pe","es-es","es-ar","es-co"];
    for(var i=0;i<priority.length;i++){
      var match = voices.find(function(v){ return v.lang && v.lang.toLowerCase() === priority[i]; });
      if(match) return match;
    }
    return voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf("es") === 0; }) || null;
  }

  function speak(text){
    if(!window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text.toLowerCase());
      var voice = pickSpanishVoice();
      if(voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = "es-ES"; }
      u.rate = 0.88;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function burstConfetti(big){
    var colors = ["#12B5AC","#FFC531","#FF6A57","#123B6B"];
    var layer = document.getElementById("confetti");
    var n = big ? 46 : 28;
    for(var i=0;i<n;i++){
      var c = document.createElement("div");
      c.className = "confetto";
      c.style.left = (Math.random()*100) + "vw";
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (1.6 + Math.random()*1.2) + "s";
      c.style.opacity = 0.85;
      layer.appendChild(c);
      (function(node){ setTimeout(function(){ node.remove(); }, 3000); })(c);
    }
  }

  function renderTopbar(){
    var html = '<img class="logo" src="data:image/png;base64,' + LOGO_FULL + '" alt="Psicoluz" />';

    if(state.screen === "welcome"){
      html += '<div class="top-meta"><span class="top-title">Psicoluz · Juego de fonemas</span></div>';
    } else if(state.screen === "phonemes"){
      html += '<button class="back-btn" id="backBtn">←</button>' +
              '<div class="top-meta"><span class="top-title">Elige un fonema</span></div>';
    } else if(state.screen === "levels"){
      html += '<button class="back-btn" id="backBtn">←</button>' +
              '<div class="top-meta"><span class="top-title">Fonema /' + state.phoneme + '/ · elige nivel</span></div>';
    } else if(state.screen === "game"){
      var lvl = PHONEMES[state.phoneme].levels[state.level];
      var dotsHtml = lvl.words.map(function(_, i){
        var cls = "dot" + (state.wordDone[i] ? " done" : (i===state.wordIndex ? " current" : ""));
        return '<div class="' + cls + '"></div>';
      }).join("");
      html += '<button class="back-btn" id="backBtn">←</button>' +
              '<div class="top-meta"><span class="level-pill">' + lvl.pill + '</span><div class="dots">' + dotsHtml + '</div></div>' +
              '<div class="stars">★ ' + state.stars + '</div>';
    } else if(state.screen === "levelComplete"){
      html += '<div class="top-meta"><span class="top-title">Fonema /' + state.phoneme + '/</span></div>' +
              '<div class="stars">★ ' + state.stars + '</div>';
    } else if(state.screen === "guide"){
      html += '<button class="back-btn" id="backBtn">←</button>' +
              '<div class="top-meta"><span class="top-title">Guía de articulación</span></div>';
    } else if(state.screen === "warmup"){
      html += '<button class="back-btn" id="backBtn">←</button>' +
              '<div class="top-meta"><span class="top-title">Fonema /' + state.phoneme + '/ · calentamiento</span></div>';
    }

    topbarEl.innerHTML = html;
    var back = document.getElementById("backBtn");
    if(back){
      back.addEventListener("click", function(){ goBack(); });
    }
  }

  function goBack(){
    if(state.screen === "phonemes"){ renderWelcome(); }
    else if(state.screen === "levels"){ renderPhonemes(); }
    else if(state.screen === "game"){ renderLevels(state.phoneme); }
    else if(state.screen === "guide"){ renderWelcome(); }
    else if(state.screen === "warmup"){ renderLevels(state.phoneme); }
  }

  // ---------- Welcome ----------
  function renderWelcome(){
    state.screen = "welcome";
    renderTopbar();
    stageEl.innerHTML =
      '<div class="center-screen">' +
        '<img class="logo-big bounce-in" src="data:image/png;base64,' + LOGO_FULL + '" alt="Psicoluz" />' +
        '<h1>¡Hola! 👋 Vamos a jugar y hablar mejor</h1>' +
        '<p>Aquí encontrarás <b>16 sonidos</b> del español para practicar. Cada uno tiene un calentamiento de sílabas (por ejemplo MA-ME-MI-MO-MU), <b>3 niveles</b> de palabras con audio real, y una guía de articulación pensada para acompañar la sesión.</p>' +
        '<div class="badge-row">' +
          '<div class="badge">🔊 Sonido real</div>' +
          '<div class="badge">🔥 Sílabas + vocales</div>' +
          '<div class="badge">🎯 3 niveles</div>' +
          '<div class="badge">📋 Guía por sonido</div>' +
        '</div>' +
        '<button class="cta" id="startBtn">Empezar a jugar</button>' +
        '<button class="link-btn" id="guideBtn">📋 ¿Cómo usar esto en terapia?</button>' +
      '</div>';
    document.getElementById("startBtn").addEventListener("click", renderPhonemes);
    document.getElementById("guideBtn").addEventListener("click", function(){ renderGuide(); });
  }

  // ---------- Phoneme picker ----------
  function renderPhonemes(){
    state.screen = "phonemes";
    renderTopbar();
    var cardsHtml = PHONEME_ORDER.map(function(key){
      var p = PHONEMES[key];
      if(p.available){
        return '<div class="phoneme-card" data-key="' + key + '">' +
                 '<span class="letter">' + p.label + '</span>' +
                 '<span class="name">/' + key + '/</span>' +
               '</div>';
      }
      return '<div class="phoneme-card locked">' +
               '<span class="letter">' + p.label + '</span>' +
               '<span class="soon">PRONTO</span>' +
             '</div>';
    }).join("");

    stageEl.innerHTML =
      '<h1 class="grid-title">¿Qué sonido quieres practicar?</h1>' +
      '<p class="sub">Toca una letra para empezar. ' + PHONEME_ORDER.length + ' fonemas disponibles, del más fácil al más difícil.</p>' +
      '<div class="phoneme-grid">' + cardsHtml + '</div>';

    document.querySelectorAll(".phoneme-card:not(.locked)").forEach(function(card){
      card.addEventListener("click", function(){
        renderLevels(card.getAttribute("data-key"));
      });
    });
  }

  // ---------- Level picker ----------
  function renderLevels(phonemeKey){
    state.phoneme = phonemeKey;
    state.screen = "levels";
    renderTopbar();
    var p = PHONEMES[phonemeKey];
    var doneMap = state.completed[phonemeKey] || {};

    var cardsHtml = Object.keys(p.levels).map(function(numKey){
      var num = parseInt(numKey, 10);
      var lvl = p.levels[numKey];
      var isDone = !!doneMap[num];
      return '<div class="level-card' + (isDone ? " done" : "") + '" data-level="' + num + '">' +
               '<div class="level-num">' + num + '</div>' +
               '<div class="level-info"><div class="lname">' + lvl.name + '</div><div class="ldesc">' + lvl.desc + ' · ' + lvl.words.length + ' palabras</div></div>' +
               (isDone ? '<div class="level-check">✓</div>' : '') +
             '</div>';
    }).join("");

    var syl = warmupSyllables(phonemeKey);
    var warmupLabel = syl.map(function(s){ return s.text; }).join(" · ");

    stageEl.innerHTML =
      '<h1 class="grid-title">Fonema /' + phonemeKey + '/</h1>' +
      '<p class="sub">Elige el nivel de dificultad.</p>' +
      '<div class="level-list">' +
        '<div class="level-card warmup" id="warmupCard">' +
          '<div class="level-num warmup-num">🔥</div>' +
          '<div class="level-info"><div class="lname">Calentamiento de sílabas</div><div class="ldesc">' + warmupLabel + '</div></div>' +
        '</div>' +
        cardsHtml +
      '</div>' +
      '<button class="link-btn" id="guideBtn2">📋 Cómo se articula la /' + phonemeKey + '/</button>';

    document.getElementById("warmupCard").addEventListener("click", function(){
      renderWarmup(phonemeKey);
    });
    document.querySelectorAll(".level-card:not(.warmup)").forEach(function(card){
      card.addEventListener("click", function(){
        startLevel(phonemeKey, parseInt(card.getAttribute("data-level"), 10));
      });
    });
    document.getElementById("guideBtn2").addEventListener("click", function(){
      renderGuide(phonemeKey);
    });
  }

  // ---------- Syllable warm-up (consonant + all 5 vowels) ----------
  var VOWELS = ["A","E","I","O","U"];
  var SYLLABLE_SPELLING = {
    K: { A:"CA", E:"QUE", I:"QUI", O:"CO", U:"CU" },
    G: { A:"GA", E:"GUE", I:"GUI", O:"GO", U:"GU" }
  };
  function warmupSyllables(phonemeKey){
    var special = SYLLABLE_SPELLING[phonemeKey];
    return VOWELS.map(function(v){
      var text = special ? special[v] : (phonemeKey + v);
      return { text:text, vowel:v };
    });
  }

  function renderWarmup(phonemeKey){
    state.screen = "warmup";
    state.phoneme = phonemeKey;
    renderTopbar();
    var syl = warmupSyllables(phonemeKey);
    var artic = ARTIC[phonemeKey];

    var tilesHtml = syl.map(function(s, i){
      return '<button class="warmup-tile" data-syl="' + s.text + '" data-vowel="' + s.vowel + '" style="animation-delay:' + (i * 60) + 'ms">' + s.text + '</button>';
    }).join("");

    stageEl.innerHTML =
      '<h1 class="game-title">Calentamiento · /' + phonemeKey + '/</h1>' +
      '<p class="sub">Toca cada sílaba y escúchala. Practica la ' + phonemeKey + ' con las 5 vocales antes de ir a las palabras.</p>' +
      '<div class="warmup-grid">' + tilesHtml + '</div>' +
      '<p class="mouth-hint" id="warmupHint" style="margin-top:16px;">👄 ' + artic.cue + '.</p>' +
      '<div class="footer-row" style="margin-top:auto;">' +
        '<button class="cta secondary" id="warmupBack">← Niveles</button>' +
        '<button class="cta" id="warmupDone">Ir a las palabras →</button>' +
      '</div>';

    document.querySelectorAll(".warmup-tile").forEach(function(btn){
      btn.addEventListener("click", function(){
        speak(btn.getAttribute("data-syl"));
        btn.classList.add("popped");
        setTimeout(function(){ btn.classList.remove("popped"); }, 350);
        var v = btn.getAttribute("data-vowel");
        var cue = MOUTH_CUES[v] || "";
        document.getElementById("warmupHint").innerHTML = "👄 " + artic.cue + ", y pasa a " + cue + ".";
      });
    });
    document.getElementById("warmupBack").addEventListener("click", function(){
      renderLevels(phonemeKey);
    });
    document.getElementById("warmupDone").addEventListener("click", function(){
      startLevel(phonemeKey, 1);
    });
  }

  // ---------- Game ----------
  function startLevel(phonemeKey, levelNum){
    state.phoneme = phonemeKey;
    state.level = levelNum;
    state.screen = "game";
    state.wordIndex = 0;
    state.wordDone = [];
    renderWord();
  }

  function speakIntroWord(w){
    setTimeout(function(){ speak(w.word); }, 250);
  }

  function currentLevel(){
    return PHONEMES[state.phoneme].levels[state.level];
  }

  function renderWord(){
    var lvl = currentLevel();
    var w = lvl.words[state.wordIndex];
    state.slotIndex = 0;
    renderTopbar();

    var slotsHtml = w.syllables.map(function(){
      return '<div class="slot"></div>';
    }).join("");

    var pool = shuffle(w.syllables.concat(w.distractors));

    var optsHtml = pool.map(function(syl){
      return '<button class="opt" data-syl="'+syl+'">'+syl+'</button>';
    }).join("");

    stageEl.innerHTML =
      '<h1 class="game-title">Palabra ' + (state.wordIndex+1) + ' de ' + lvl.words.length + '</h1>' +
      '<p class="sub">Toca las sílabas en orden para formar la palabra.</p>' +
      '<div class="word-panel">' +
        '<img class="pic" src="'+picSrc(w.img)+'" alt="'+w.word+'" onerror="this.onerror=null;this.src=PIC_FALLBACK;" />' +
        '<div class="slots" id="slots">' + slotsHtml + '</div>' +
        '<button class="listen-btn" id="listenWord" aria-label="Escuchar palabra">' +
          '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24zM16 4.5v2.08c2.89 1.02 5 3.76 5 7.42s-2.11 6.4-5 7.42v2.08c4.01-1.07 7-4.72 7-9.5s-2.99-8.43-7-9.5z"/></svg>' +
        '</button>' +
      '</div>' +
      '<p class="prompt">Toca la sílaba <b>' + w.syllables[0] + '</b> primero</p>' +
      '<div class="options" id="options">' + optsHtml + '</div>' +
      '<div class="footer-row">' +
        '<div class="mouth-hint" id="mouthHint">' + mouthHintFor(state.phoneme, w.syllables[0]) + '</div>' +
        '<button class="next-btn" id="nextBtn">Siguiente →</button>' +
      '</div>';

    document.getElementById("listenWord").addEventListener("click", function(){
      speak(w.word);
    });

    document.querySelectorAll(".opt").forEach(function(btn){
      btn.addEventListener("click", function(){ handleTap(btn, w); });
    });

    document.getElementById("nextBtn").addEventListener("click", goNext);

    speakIntroWord(w);
  }

  function handleTap(btn, w){
    var syl = btn.getAttribute("data-syl");
    var expected = w.syllables[state.slotIndex];

    speak(syl);

    if(syl === expected){
      btn.classList.add("correct");
      btn.disabled = true;
      var slots = document.querySelectorAll("#slots .slot");
      slots[state.slotIndex].textContent = syl;
      slots[state.slotIndex].classList.add("filled");
      state.slotIndex++;

      if(state.slotIndex >= w.syllables.length){
        document.getElementById("options").querySelectorAll(".opt").forEach(function(b){ b.disabled = true; });
        document.querySelector(".prompt").innerHTML = "¡Muy bien! Completaste <b>" + w.word + "</b> 🎉";
        if(!state.wordDone[state.wordIndex]){
          state.wordDone[state.wordIndex] = true;
          state.stars++;
        }
        burstConfetti(false);
        document.getElementById("nextBtn").classList.add("show");
        renderTopbar();
        var starsEl = document.querySelector(".stars");
        if(starsEl){ starsEl.classList.add("pop"); setTimeout(function(){ starsEl.classList.remove("pop"); }, 500); }
      } else {
        document.querySelector(".prompt").innerHTML = "Ahora toca la sílaba <b>" + w.syllables[state.slotIndex] + "</b>";
        var hintEl = document.getElementById("mouthHint");
        if(hintEl) hintEl.innerHTML = mouthHintFor(state.phoneme, w.syllables[state.slotIndex]);
      }
    } else {
      btn.classList.add("wrong");
      setTimeout(function(){ btn.classList.remove("wrong"); }, 420);
    }
  }

  function goNext(){
    var lvl = currentLevel();
    if(state.wordIndex < lvl.words.length - 1){
      state.wordIndex++;
      renderWord();
    } else {
      renderLevelComplete();
    }
  }

  // ---------- Level complete (celebration) ----------
  function renderLevelComplete(){
    state.screen = "levelComplete";
    if(!state.completed[state.phoneme]) state.completed[state.phoneme] = {};
    state.completed[state.phoneme][state.level] = true;

    renderTopbar();
    burstConfetti(true);
    setTimeout(function(){ burstConfetti(true); }, 350);

    var lvl = currentLevel();
    var levels = PHONEMES[state.phoneme].levels;
    var nextLevelNum = state.level + 1;
    var hasNext = !!levels[nextLevelNum];

    stageEl.innerHTML =
      '<div class="center-screen">' +
        '<div class="yay">¡Excelente trabajo!</div>' +
        '<div class="final-stars">★★★★★</div>' +
        '<h1>¡Muy bien! ¡Felicitaciones! 🎉</h1>' +
        '<p>Completaste el <b>' + lvl.name + '</b> del fonema /' + state.phoneme + '/ formando las ' + lvl.words.length + ' palabras. ¡Sigue así!</p>' +
        (hasNext
          ? '<button class="cta" id="nextLevelBtn">Ir al siguiente nivel →</button>'
          : '<p class="sub" style="margin-top:0;">¡Terminaste todos los niveles de este fonema! 🏆</p>') +
        '<button class="cta secondary" id="levelsBtn">Volver a los niveles</button>' +
        '<button class="link-btn" id="phonemesBtn">🔤 Elegir otro fonema</button>' +
      '</div>';

    if(hasNext){
      document.getElementById("nextLevelBtn").addEventListener("click", function(){
        startLevel(state.phoneme, nextLevelNum);
      });
    }
    document.getElementById("levelsBtn").addEventListener("click", function(){
      renderLevels(state.phoneme);
    });
    document.getElementById("phonemesBtn").addEventListener("click", renderPhonemes);
  }

  // ---------- Guide ----------
  function renderGuide(phonemeKey){
    var fromPhoneme = !!phonemeKey;
    var key = phonemeKey || "M";
    var artic = ARTIC[key];
    var p = PHONEMES[key];
    state.screen = "guide";
    state.phoneme = key;
    renderTopbar();

    var levelsHtml = "";
    if(p && p.levels){
      levelsHtml = Object.keys(p.levels).map(function(numKey){
        var l = p.levels[numKey];
        var sample = l.words.slice(0, 3).map(function(w){ return w.word; }).join(", ");
        return '<li><b>' + l.name + '</b>: ' + l.desc.toLowerCase() + ' (' + sample + '...)</li>';
      }).join("");
    }

    stageEl.innerHTML =
      '<div class="guide">' +
        '<h1 class="game-title">Guía de articulación · /' + key + '/</h1>' +
        '<p class="sub">Para la terapeuta, docente o familia que acompaña el juego.</p>' +

        '<h3>¿Qué tipo de sonido es la ' + key + '?</h3>' +
        '<p class="g-text">Es un fonema <b>' + artic.type + '</b>. Ubica bien la posición antes de pedir la palabra completa: primero el sonido aislado, luego en sílabas, y recién después en palabras.</p>' +

        '<h3>Cómo modelarlo</h3>' +
        '<p class="g-text">' + artic.cue + '. Exageren el movimiento al inicio frente a un espejo y redúzcanlo poco a poco a medida que el niño lo domine.</p>' +

        '<h3>Apoyos útiles durante la sesión</h3>' +
        '<ul class="g-list">' +
          '<li>Usar un espejo para que el niño vea su propia boca y la del adulto al mismo tiempo.</li>' +
          '<li>Dar el modelo correcto ANTES de que el niño intente, no solo corregir después.</li>' +
          '<li>Sesiones cortas y frecuentes rinden más que una sesión larga y cansada.</li>' +
          '<li>Si el sonido es sonoro (vibra), una mano en el cuello ayuda a sentir la diferencia con uno sordo.</li>' +
        '</ul>' +

        '<h3>Si la respuesta es incorrecta</h3>' +
        '<p class="g-text">Eviten decir solo "no" o "mal". Es mejor volver a modelar el sonido y pedir que lo intente de nuevo. El juego no deja avanzar hasta acertar, así que no hay apuro: repitan con calma las veces que haga falta.</p>' +

        (levelsHtml ? '<h3>Progresión del juego para /' + key + '/</h3><ul class="g-list">' + levelsHtml + '</ul>' : '') +

        '<button class="cta" id="backBtn2">Volver</button>' +
      '</div>';
    document.getElementById("backBtn2").addEventListener("click", function(){
      if(fromPhoneme){ renderLevels(key); } else { renderWelcome(); }
    });
  }

  renderWelcome();
})();
</script>
