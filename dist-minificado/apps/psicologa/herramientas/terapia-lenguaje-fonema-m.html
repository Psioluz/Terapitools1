width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.back-btn:active{transform:scale(.92)}.top-meta{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.top-title{color:#fff;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.level-pill{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--navy);background:var(--gold);padding:3px 10px;border-radius:999px}.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:14px;height:8px;border-radius:6px;background:rgba(255,255,255,.25);transition:all .25s ease}.dot.done{background:var(--teal);width:20px}.dot.current{background:var(--gold);width:20px}.stars{display:flex;align-items:center;gap:4px;color:var(--gold);font-weight:800;font-size:14px;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px;flex-shrink:0}.stars.pop{animation:starPop .5s ease}@keyframes starPop{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}.stage{margin-top:16px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px 20px 26px;position:relative;min-height:520px;display:flex;flex-direction:column}h1.game-title{font-size:24px;margin:2px 0 4px;letter-spacing:-.01em;text-wrap:balance}.sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 18px}.word-panel{background:var(--mint);border:2px solid var(--ring);border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}.word-panel img.pic{width:84px;height:84px;border-radius:16px;object-fit:cover;box-shadow:0 6px 14px -6px rgba(0,0,0,.25);background:#fff;flex-shrink:0}.slots{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:120px}.slot{min-width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--ink);back
